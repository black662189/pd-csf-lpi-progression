name: Synthetic reproducibility check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true
      - name: Install model packages
        run: Rscript -e 'install.packages(c("lme4", "lmerTest"), repos="https://cloud.r-project.org")'
      - name: Run synthetic end-to-end check
        run: Rscript tests/smoke.R outputs/ci-synthetic
